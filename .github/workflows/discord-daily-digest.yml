name: Discord Daily Push Digest

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 KST
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send one digest message per author
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          git log origin/main --since="24 hours ago" --pretty=format:'%an%x09%h%x09%H%x09%s' > commits.tsv

          if [ ! -s commits.tsv ]; then
            echo "No commits in the last 24h, skipping notification."
            exit 0
          fi

          COMMIT_BASE_URL="https://github.com/${{ github.repository }}/commit"
          REPO_URL="https://github.com/${{ github.repository }}/commits/main"

          cut -f1 commits.tsv | sort -u | while IFS= read -r author; do
            COMMITS=$(awk -F'\t' -v a="$author" -v base="$COMMIT_BASE_URL" \
              '$1==a {print "- [`" $2 "`](" base "/" $3 ") " $4}' commits.tsv)
            PAYLOAD=$(jq -n \
              --arg repo "${{ github.repository }}" \
              --arg author "$author" \
              --arg commits "$COMMITS" \
              --arg url "$REPO_URL" \
              '{
                embeds: [{
                  title: ($repo + " — " + $author + "님의 지난 24시간 작업"),
                  description: $commits,
                  url: $url,
                  color: 3066993
                }]
              }')
            curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
            sleep 1
          done
